# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
    name: github
    repo: PlanckTeam/planckteam.github.io
    branch: main

media_folder: /media
public_folder: /media

i18n:
    structure: multiple_folders
    locales: [en, it]

collections:
    - name: blog
      label: Posts
      label_singular: Post
      folder: /src/content/blog
      i18n: true
      fields:
          - { label: Title, name: title, widget: string, i18n: true }
          - { label: Description, name: description, widget: string, i18n: true }
          - { label: Publish Date, name: pubDate, widget: datetime, type: date }
          - {
                label: Updated Date,
                name: updatedDate,
                widget: datetime,
                type: date,
            }
          - {
                label: Hero Image,
                name: heroImage,
                widget: image,
                required: false,
            }
          - { label: Body, name: body, widget: richtext, i18n: true }
