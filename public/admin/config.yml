# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
    name: github
    repo: PlanckTeam/planckteam.github.io
    branch: main
    base_url: https://sveltia-cms-auth.gregoriomontagner274.workers.dev

media_folder: /public/media
public_folder: /media

# Slugify uploaded filenames (`Screenshot ....png` -> `screenshot-....png`)
# so entries never reference paths with spaces/special chars.
media_libraries:
    default:
        config:
            slugify_filename: true

# URL-encode file paths written to frontmatter + drop empty optional fields
# (avoids `heroImage: ''` noise).
output:
    encode_file_path: true
    omit_empty_optional_fields: true

i18n:
    structure: multiple_folders
    locales: [en, it]

collections:
    - name: blog
      label: Posts
      label_singular: Post
      folder: /src/content/blog
      i18n: true
      fields:
          - { label: Title, name: title, widget: string, i18n: true, required: true }
          - { label: Description, name: description, widget: string, i18n: true, required: true }
          - { label: Publish Date, name: pubDate, widget: datetime, type: date, i18n: true, required: true }
          - {
                label: Updated Date,
                name: updatedDate,
                widget: datetime,
                type: date,
                i18n: true,
            }
          - {
                label: Hero Image,
                name: heroImage,
                widget: image,
                required: false,
                i18n: true,
            }
          - { label: Body, name: body, widget: richtext, i18n: true }
